name: Build and push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - claude-code.Dockerfile
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      anthropic_version:
        description: anthropic SDK version to build (defaults to the Dockerfile's ARG default)
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve anthropic version
        id: version
        run: |
          version="${{ inputs.anthropic_version }}"
          if [ -z "$version" ]; then
            version=$(grep -m1 '^ARG ANTHROPIC_VERSION=' Dockerfile | cut -d= -f2)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ANTHROPIC_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

  build-claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Claude Code version
        id: version
        run: echo "version=$(grep -m1 '^ARG CLAUDE_CODE_VERSION=' claude-code.Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: claude-code.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:claude-code-${{ steps.version.outputs.version }}
